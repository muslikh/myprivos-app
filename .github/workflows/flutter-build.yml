name: Build Flutter (APK + iOS)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FLUTTER_CHANNEL: stable

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGN: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true

      - name: Generate platform folders + deps
        run: |
          flutter create . --platforms android --org com.smkn1prigen --project-name myprivos_app
          flutter pub get

      - name: Konfigurasi Android (izin internet, nama, ikon)
        run: |
          python3 - <<'PY'
          import re
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perms = ('    <uses-permission android:name="android.permission.INTERNET"/>\n'
                   '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n')
          if "android.permission.INTERNET" not in s:
              s = re.sub(r'(<manifest\b[^>]*>)', r'\1\n' + perms, s, count=1, flags=re.S)
          s = re.sub(r'android:label="[^"]*"', 'android:label="My Privos"', s, count=1)
          open(p, "w").write(s)
          print("AndroidManifest patched (INTERNET + REQUEST_INSTALL_PACKAGES + label)")
          PY
          python3 -c "p='pubspec.yaml';open(p,'w').write(open(p).read().replace('  ios: true','  ios: false'))"
          dart run flutter_launcher_icons

      - name: Setup release signing (optional)
        if: env.SIGN == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KS_PASS
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASS
          EOF

      - name: Build APK (release)
        run: flutter build apk --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Build AAB (release)
        run: flutter build appbundle --release --build-name=1.0.${{ github.run_number }} --build-number=${{ github.run_number }} || true

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Auto tag + Release (APK + AAB)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('Build v1.0.{0}', github.run_number) }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

  ios:
    name: iOS build (unsigned)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - name: Generate platform folders + deps
        run: |
          flutter create . --platforms ios --org com.smkn1prigen --project-name myprivos_app
          flutter pub get
      - name: Nama app + ikon iOS
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName My Privos" ios/Runner/Info.plist \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string My Privos" ios/Runner/Info.plist
          python3 -c "p='pubspec.yaml';open(p,'w').write(open(p).read().replace('  android: true','  android: false'))"
          dart run flutter_launcher_icons || true
      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
      - name: Package .app artifact
        run: |
          cd build/ios/iphoneos
          zip -r -q Runner-unsigned-app.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-app
          path: build/ios/iphoneos/Runner-unsigned-app.zip
